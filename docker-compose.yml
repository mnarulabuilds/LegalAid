services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: legalaid
      POSTGRES_PASSWORD: legalaid
      POSTGRES_DB: legalaid
    ports:
      - "5432:5432"
    volumes:
      - legalaid_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalaid -d legalaid"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://legalaid:legalaid@db:5432/legalaid
      AUTH_SECRET: ${AUTH_SECRET:-local-dev-secret-change-me-in-production}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: LegalAid
      RUN_DB_PUSH: "true"
      RUN_SEED: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  legalaid_pg:
